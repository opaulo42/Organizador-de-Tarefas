<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--navy:#14284b;--blue:#2563eb;--bg:#f4f6fa;--card:#fff;--tx:#1b2430;--mut:#6b7686;--bd:#dde3ec}

.b0{background:#8b95a3}.b1{background:#2563eb}.b2{background:#7c3aed}.b3{background:#d97706}.b4{background:#0d9488}.b5{background:#16a34a}
.obs{font-size:13px;color:#445;margin-top:6px;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.obs.open{display:block}.orow{display:flex;gap:8px;align-items:flex-end;margin-top:6px}.orow .obs{flex:1;min-width:0;margin-top:0}.tb{display:flex;gap:6px;align-items:center;margin-bottom:6px}.tb button{width:40px;height:36px;border:1px solid var(--bd);border-radius:8px;background:#fff;font-size:16px}.tb small{color:var(--mut)}.mais{white-space:nowrap;flex:none;background:none;border:0;color:var(--blue);padding:4px 0;font-size:13px;cursor:pointer}

.mh{display:flex;justify-content:space-between;align-items:center;gap:8px}.mh .btn{padding:8px 10px;font-size:14px;min-height:40px}

.top{align-items:center;gap:12px}.prox{margin-top:8px;padding:6px 8px;border-radius:8px;background:#eef2f9;font-size:13px}.tt{flex:1;display:flex;flex-direction:column;line-height:1.3;min-width:0}.tt b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tt b+b{font-weight:600;color:#445}.ficha{padding:14px}.ficha .emp{margin:10px 0 2px;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.top .badge{margin:0;flex:none}.dst{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px;font-size:17px}.seta{background:none;border:0;font-size:24px;line-height:1;padding:6px 10px;cursor:pointer;color:var(--navy);transition:transform .15s}.seta.up{transform:rotate(180deg)}
.mv{margin-top:8px;width:100%;padding:8px;border-radius:8px;border:1px solid var(--bd);background:#fff}
.list{padding:0 16px 24px;display:grid;gap:10px}

.box label{display:block;font-size:13px;color:var(--mut);margin-top:8px}
.box input,.box textarea,.box select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}
.arq{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}

.arq button{padding:6px 10px;border-radius:8px;border:1px solid var(--bd);background:#fff}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.sync{font-size:12px;opacity:.85;width:100%}
.ck svg,.seta svg{display:block;margin:auto}.seta{padding:4px 8px}
.det{margin-top:10px;padding-top:12px;border-top:1px solid var(--bd);display:grid;gap:10px}
.r{display:flex;justify-content:space-between;gap:12px;font-size:14px}.r span{color:var(--mut)}.r b{font-weight:600;text-align:right;word-break:break-word}
.prox{margin:0;padding:8px 10px;border-radius:8px;border-left:4px solid var(--c,#2563eb);background:#f1f5fb;font-size:15px;display:flex;flex-direction:column}

.obsb{background:#f7f9fc;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.acx{display:flex;gap:8px}.acx .mv{margin:0;flex:1;min-width:0}.acx .ed{min-height:40px;padding:8px 12px;white-space:nowrap}
.sec{background:#f6f8fc;border:1px solid var(--bd);border-radius:12px;padding:4px 12px 12px;margin-top:12px}.sec h3{margin:10px 0 2px}
.box label.addf{text-align:center;border:1.5px dashed var(--blue);color:var(--blue);border-radius:10px;padding:10px;margin-top:10px;cursor:pointer;font-size:15px}
.foot{position:sticky;bottom:0;background:#fff;margin:14px -16px -16px;padding:12px 16px 16px;border-top:1px solid var(--bd);border-radius:0 0 16px 16px}
.foot .acts{margin-top:0}.foot .fechar{margin:10px 0 0;padding:0;border:0}#mSave{flex:1 1 130px;font-weight:600}
.mh .btn{display:flex;align-items:center;gap:6px}
.er{background:#f6f8fc;border:1px solid var(--bd);border-radius:12px;padding:10px;margin-top:10px;display:grid;gap:8px}.er1{display:flex;gap:6px;align-items:center}.er1 .ec{width:46px;height:40px;padding:2px;flex:none}.er1 .en{flex:1;min-width:0}.er1 button{width:38px;height:40px;border:1px solid var(--bd);border-radius:8px;background:#fff;flex:none}.er1 button:disabled{opacity:.35}.box label.eo{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin:0}.eo input{width:auto}
#pj{font-weight:600}.er1 .pn{flex:1;min-width:0}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;flex:1 1 220px}.bar .chk input{flex:none;width:20px;height:20px;min-height:0;padding:0}.ptag{font-size:12px;color:var(--mut);margin:6px 0 0}
@media(min-width:901px){.board{height:var(--bh,auto);grid-template-rows:minmax(0,1fr);align-items:stretch}.col{overflow-y:auto;min-height:0}.col h2{position:sticky;top:-10px;background:inherit;z-index:1}.board{cursor:default}}
.sd{position:fixed;top:50%;width:38px;height:64px;border:0;border-radius:10px;background:rgba(20,40,75,.75);color:#fff;font-size:30px;line-height:1;cursor:pointer;display:none;z-index:5}#sL{left:4px}#sR{right:4px}
</style></head><body>
<header><h1>📒 Minhas Notas</h1>
<button class="btn hd" id="bNova">+ Nova ficha</button>
<button class="btn hd" id="bZip">⬇ Baixar todas as fichas</button>
<button class="btn hd" id="bImp">⬆ Importar dados</button><input type="file" id="impf" hidden><button class="btn hd" id="bDrv">☁ Drive</button><button class="btn hd" id="bEt">⚙ Etapas</button>
<div class="sync" id="sync">● Salvo neste dispositivo (funciona sem internet)</div></header>
<div class="bar">
<select id="pj"></select><button class="btn sec" id="bPj">📁 Projetos</button>

<main id="main"></main>
<div id="modal"><div class="box" id="box"></div></div>
<button id="sL" class="sd" aria-label="Rolar para a esquerda">‹</button><button id="sR" class="sd" aria-label="Rolar para a direita">›</button>
<script>
const DEF=[{id:'Pendente',nome:'Pendente',cor:'#8b95a3',acao:'Lançar no estoque',op:0},{id:'No Estoque',nome:'No Estoque',cor:'#2563eb',acao:'Lançar no sistema',op:0},{id:'No Sistema',nome:'No Sistema',cor:'#7c3aed',acao:'Enviar ao financeiro',op:0},{id:'Enviado para Financeiro',nome:'Enviado para Financeiro',cor:'#d97706',acao:'Finalizar a nota',op:0},{id:'Dar baixa no sistema',nome:'Dar baixa no sistema',cor:'#0d9488',acao:'Concluir a baixa no sistema',op:1},{id:'Tudo Pronto',nome:'Tudo Pronto',cor:'#16a34a',acao:'',op:0}];
const lerEt=()=>{try{const j=JSON.parse(localStorage.getItem('mn_etapas')||'null');if(Array.isArray(j)&&j.length)return j}catch(e){}return DEF.map(e=>({...e}))};
const lerProj=()=>{try{const j=JSON.parse(localStorage.getItem('mn_projetos')||'null');if(Array.isArray(j)&&j.length)return j}catch(e){}return [{id:'geral',nome:'Geral',etapas:lerEt(),t:+localStorage.getItem('mn_etapas_t')||0}]};
let PROJ=lerProj(),PA,ETAPAS=[],S=[];
const vis_=()=>PROJ.filter(p=>!p.del),ativos=()=>PROJ.filter(p=>!p.del&&!p.arq),proj=id=>PROJ.find(p=>p.id===id);
function salvaProj(){try{localStorage.setItem('mn_projetos',JSON.stringify(PROJ))}catch(e){}}
function usaProj(id){if(!ativos().length)PROJ.push({id:'p'+Date.now().toString(36),nome:'Geral',etapas:DEF.map(e=>({...e})),t:Date.now()});let p=proj(id);if(!p||p.del)p=ativos()[0];PA=p.id;ETAPAS=p.etapas;S=ETAPAS.map(e=>e.id);try{localStorage.setItem('mn_pa',PA)}catch(e){}}
usaProj((()=>{try{return localStorage.getItem('mn_pa')}catch(e){return null}})());
function setEtapas(l,t){const p=proj(PA);p.etapas=l;p.t=t;salvaProj();usaProj(PA)}
const et=id=>ETAPAS.find(e=>e.id===id),nome=id=>et(id)?.nome||id,cor=id=>et(id)?.cor||'#8b95a3';
function prox(id){const i=S.indexOf(id);if(i<0)return null;for(let j=i+1;j<ETAPAS.length;j++)if(!ETAPAS[j].op)return ETAPAS[j].id;return null}
const acaoTxt=f=>{const e=et(f.status),n=prox(f.status);return (e&&e.acao)||(n?'Avançar para '+nome(n):'')};
const moeda=s=>{s=String(s||'').replace(/[^\d,.\-]/g,'');if(!s)return null;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');const n=parseFloat(s);return isNaN(n)?null:Math.round(n*100)/100};
const brl=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const MAP={'Aguardando':'No Sistema','Em andamento':'No Sistema','Cadastrado no Estoque':'No Sistema','Para Fazer':'No Estoque','Cadastrado':'No Estoque','Pronto':'Tudo Pronto'};let EX=new Set(),ABR=new Set(),GL=false;
let db,fichas=[],M=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fmt=d=>d?new Date(d).toLocaleDateString('pt-BR'):'';
function say(t,warn){const m=$('msg');m.textContent=t;m.className=warn?'w':'';m.style.display=t?'block':'none'}
function open_(){return new Promise((ok,no)=>{const r=indexedDB.open('minhas-notas',2);
r.onupgradeneeded=()=>{const d=r.result,h=n=>d.objectStoreNames.contains(n);if(!h('fichas'))d.createObjectStore('fichas',{keyPath:'id'});if(!h('arquivos'))d.createObjectStore('arquivos',{keyPath:'id'}).createIndex('fichaId','fichaId');};
r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function run(stores,fn){return new Promise((ok,no)=>{const t=db.transaction(stores,'readwrite');let out;
Promise.resolve(fn(t)).then(v=>out=v);t.oncomplete=()=>ok(out);t.onerror=t.onabort=()=>no(t.error)})}
const req=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const getFiles=id=>req(db.transaction('arquivos').objectStore('arquivos').index('fichaId').getAll(id));
async function load(){fichas=await req(db.transaction('fichas').objectStore('fichas').getAll());
const vel=fichas.filter(f=>{let ch=false,p=proj(f.projeto||'geral');if(!p||p.del){p=ativos()[0];ch=true}if(f.projeto!==p.id){f.projeto=p.id;ch=true}const ids=p.etapas.map(e=>e.id);if(!ids.includes(f.status)){f.status=ids.includes(MAP[f.status])?MAP[f.status]:ids[0];ch=true}return ch});if(vel.length){await run('fichas',t=>vel.forEach(f=>t.objectStore('fichas').put(f)))}
render()}
function match(f){const q=$('q').value.trim().toLowerCase();
if(q&&![f.ne,f.nf,f.empresa,f.destino,f.obs].some(v=>String(v||'').toLowerCase().includes(q)))return false;
const s=$('fs').value;return GL||!s||f.status===s}
const fmtObs=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
function wrap(m){const t=$('fob'),a=t.selectionStart,b=t.selectionEnd,v=t.value;t.value=v.slice(0,a)+m+v.slice(a,b)+m+v.slice(b);t.focus();t.setSelectionRange(a+m.length,b+m.length)}
function obs(f){if(!f.obs)return '';const o=EX.has(f.id);
return `<div class="orow"><div class="obs${o?' open':''}">${fmtObs(f.obs)}</div>`+(f.obs.length>70||f.obs.includes('\n')?`<button class="mais" data-ob="${f.id}">${o?'Ler menos':'Ler mais'}</button>`:'')+'</div>'}
function noProj(f,fn){const pe=ETAPAS,ps=S,p=proj(f.projeto);if(!p||p.id===PA)return fn();ETAPAS=p.etapas;S=ETAPAS.map(e=>e.id);try{return fn()}finally{ETAPAS=pe;S=ps}}
const CKS='<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHV='<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ckBtn=f=>{const n=prox(f.status);return n?`<button class="ck" data-ck="${f.id}" title="${acaoTxt(f)}" aria-label="${acaoTxt(f)}">${CKS}</button>`:`<button class="ck ok" disabled aria-label="Concluída">${CKS}</button>`};
function advance(id){const f=fichas.find(x=>x.id===id);if(!f)return;noProj(f,()=>{const n=prox(f.status);if(!n)return;say(`NE ${f.ne||'—'} | NF ${f.nf||'—'} movida para "${nome(n)}".`);move(id,n)})}
function card(f){const i=S.indexOf(f.status),ab=ABR.has(f.id),v=f.valor!=null&&f.valor!=='';
return `<div class="ficha" style="--c:${cor(f.status)};border-color:${cor(f.status)}" draggable="true" data-id="${f.id}"><div class="top">${ckBtn(f)}<div class="tt"><b>NE ${esc(f.ne)||'—'}</b><b>NF ${esc(f.nf)||'—'}</b></div>${$('vw').value==='board'&&!GL?'':`<span class="badge" style="background:${cor(f.status)}">${esc(nome(f.status))}</span>`}</div>
${GL?`<div class="ptag">📁 ${esc((proj(f.projeto)||{}).nome||'')}${(proj(f.projeto)||{}).arq?' · arquivado':''}</div>`:''}<div class="emp">${f.empresa?'Empresa: '+esc(f.empresa):''}</div>
<div class="dst"><small>${fmt(f.atualizada)}</small><button class="seta${ab?' up':''}" data-seta="${f.id}" aria-label="${ab?'Recolher':'Ver detalhes'}">${CHV}</button></div>
${ab?`<div class="det"><div class="r"><span>Destino</span><b>${esc(f.destino)||'—'}</b></div>${v?`<div class="r"><span>Valor</span><b>${brl(f.valor)}</b></div>`:''}${f.anexos?`<div class="r"><span>Local dos anexos</span><b>${esc(f.anexos)}</b></div>`:''}${prox(f.status)?`<div class="prox"><span>Próximo passo</span><b>${acaoTxt(f)}</b></div>`:''}${f.obs?`<div class="obsb"><span class="lb">Observações</span><div>${fmtObs(f.obs)}</div></div>`:''}<div class="acx"><select class="mv" data-mv="${f.id}"><option value="">Mover para…</option>${S.filter(s=>s!==f.status).map(s=>`<option value="${s}">${esc(nome(s))}</option>`).join('')}</select><button class="btn sec ed">✎ Editar</button></div></div>`:''}</div>`}
function linha(){const el=$('sync');if(!el)return;let t='● Salvo neste dispositivo (funciona sem internet)';
try{if(localStorage.getItem('mn_cid')){const last=+localStorage.getItem('mn_last')||0,p=fichas.filter(f=>f.atualizada>last).length+Object.values(tomb()).filter(v=>v>last).length;t+=p?` · ◐ ${p} alteração(ões) ainda não enviada(s) ao Drive`:' · ✔ Drive em dia'}}catch(e){}el.textContent=t}
function render(){render0();ajustaBoard()}
function render0(){linha();{const b=$('bFt');b.style.display=ABR.size?'':'none';b.textContent=`Fechar fichas abertas (${ABR.size})`}const v=$('vw').value,m=$('main');
GL=$('qa').checked;$('fs').disabled=GL;
const vis=fichas.filter(f=>(GL||f.projeto===PA)&&(v==='arq'?f.arquivada:!f.arquivada)&&match(f)).sort((a,b)=>b.atualizada-a.atualizada);
if(v==='board'&&!GL){m.innerHTML='<div class="board">'+S.filter(s=>!$('fs').value||s===$('fs').value).map(s=>{const l=vis.filter(f=>f.status===s);
return `<div class="col" style="border-top:4px solid ${cor(s)}" data-col="${s}"><h2>${esc(nome(s))} <span class="n">${l.length}</span><button class="btn sec" style="min-height:32px;padding:2px 10px" data-new="${s}">+</button></h2>${l.map(card).join('')}</div>`}).join('')+'</div>'}
else m.innerHTML='<div class="list">'+(vis.map(f=>noProj(f,()=>card(f))).join('')||'<p>Nenhuma ficha.</p>')+'</div>'}
document.addEventListener('click',e=>{
const n=e.target.closest('[data-new]');if(n){return edit(null,n.dataset.new)}

<button class="btn sec" id="pAdd" style="width:100%;margin-top:10px">＋ Novo projeto</button>
${PL.l.some(p=>!p.del&&p.arq)?`<h3 style="margin:18px 0 0;font-size:13px;color:var(--navy);text-transform:uppercase;letter-spacing:.04em">Arquivados</h3>${lista(true)}`:''}

drawProj()});

async function salvarProj(){lerPn();const L=PL.l.filter(p=>!p.del);
if(L.some(p=>!p.nome.trim())){alert('Todos os projetos precisam de nome.');return}
const nn=L.map(p=>p.nome.trim().toLowerCase());if(new Set(nn).size!==nn.length){alert('Há projetos com o mesmo nome.');return}
const old=new Map(PROJ.map(p=>[p.id,p]));
const nova=PL.l.map(p=>{const o=old.get(p.id),nm=p.nome.trim(),ch=!o||o.nome!==nm||!!o.del!==!!p.del||!!o.arq!==!!p.arq;const r={id:p.id,nome:nm,etapas:p.etapas,t:ch?Date.now():o.t,arq:p.arq?1:0};if(p.del)r.del=1;return r});
const exist=new Set(nova.filter(p=>!p.del).map(p=>p.id)),ativ=nova.filter(p=>!p.del&&!p.arq).map(p=>p.id);
const dest=id=>{let d=PL.mov[id],g=0;while(d&&!exist.has(d)&&g++<20)d=PL.mov[d];return exist.has(d)?d:ativ[0]};
const mv=fichas.filter(f=>!exist.has(f.projeto));
try{mv.forEach(f=>{const d=dest(f.projeto);f.projeto=d;f.status=nova.find(p=>p.id===d).etapas[0].id;f.atualizada=Date.now()});if(mv.length)await run('fichas',t=>mv.forEach(f=>t.objectStore('fichas').put(f)))}catch(e){alert('Erro ao salvar: '+(e?.message||e));return}
PROJ=nova;salvaProj();usaProj(nova.find(p=>p.id===PA&&p.arq)?null:PA);close_();fillProj();fillFs();ABR.clear();render();say('Projetos salvos.'+(mv.length?` ${mv.length} ficha(s) movida(s).`:''))}
$('bPj').onclick=()=>{PL={l:PROJ.map(p=>({...p,etapas:p.etapas.map(e=>({...e}))})),mov:{}};drawProj()};

function ajustaBoard(){const b=document.querySelector('.board'),L=$('sL'),R=$('sR');
if(!b||innerWidth<=900){if(b)b.style.removeProperty('--bh');L.style.display=R.style.display='none';return}
b.style.setProperty('--bh',Math.max(320,innerHeight-(b.getBoundingClientRect().top+scrollY)-12)+'px');
const ov=b.scrollWidth>b.clientWidth+2;L.style.display=ov&&b.scrollLeft>2?'block':'none';R.style.display=ov&&b.scrollLeft<b.scrollWidth-b.clientWidth-2?'block':'none';b.onscroll=ajustaBoard}
$('sL').onclick=()=>document.querySelector('.board').scrollBy({left:-320,behavior:'smooth'});
$('sR').onclick=()=>document.querySelector('.board').scrollBy({left:320,behavior:'smooth'});
addEventListener('resize',ajustaBoard);

let PAN=null;

document.addEventListener('mousemove',e=>{if(PAN)PAN.b.scrollLeft=PAN.l-(e.clientX-PAN.x)});

document.addEventListener('dragover',e=>{const b=document.querySelector('.board');if(!b)return;const r=b.getBoundingClientRect();if(e.clientX<r.left+70)b.scrollLeft-=18;else if(e.clientX>r.right-70)b.scrollLeft+=18});
