<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas Notas</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#14284b"><link rel="icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--navy:#14284b;--blue:#2563eb;--bg:#f4f6fa;--card:#fff;--tx:#1b2430;--mut:#6b7686;--bd:#dde3ec}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:20px;margin:0;flex:1 1 auto}
button,select,input,textarea{font:inherit}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:#fff;cursor:pointer;min-height:44px}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--bd)}
.btn.hd{background:rgba(255,255,255,.15)}
.btn.red{background:#dc2626}.btn.grn{background:#16a34a}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
.bar input,.bar select{flex:1 1 180px;padding:10px;border:1px solid var(--bd);border-radius:10px;min-height:44px;background:#fff}
#msg{margin:0 16px;padding:10px 12px;border-radius:10px;background:#e0ecff;display:none}
#msg.w{background:#fff3d6}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:0 16px 24px}
@media(max-width:900px){.board{grid-template-columns:1fr}}
.col{background:#e9edf4;border-radius:14px;padding:10px;min-height:120px}
.col h2{font-size:15px;margin:2px 4px 10px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.col h2 span.n{color:var(--mut);font-weight:400}
.col.over{outline:2px dashed var(--blue)}
.ficha{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;border-left:5px solid #9aa3b0;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.ficha b{font-size:16px}.ficha small{color:var(--mut)}
.ficha .emp{font-size:13px;color:#445}
.s0{border-color:#8b95a3}.s1{border-color:#2563eb}.s2{border-color:#f59e0b}.s3{border-color:#16a34a}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;color:#fff;margin-top:4px}
.b0{background:#8b95a3}.b1{background:#2563eb}.b2{background:#d97706}.b3{background:#16a34a}
.obs{font-size:13px;color:#445;margin-top:6px;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.obs.open{display:block}.orow{display:flex;gap:8px;align-items:flex-end;margin-top:6px}.orow .obs{flex:1;min-width:0;margin-top:0}.tb{display:flex;gap:6px;align-items:center;margin-bottom:6px}.tb button{width:40px;height:36px;border:1px solid var(--bd);border-radius:8px;background:#fff;font-size:16px}.tb small{color:var(--mut)}.mais{white-space:nowrap;flex:none;background:none;border:0;color:var(--blue);padding:4px 0;font-size:13px;cursor:pointer}
.fechar{display:flex;justify-content:flex-end;margin-top:14px;padding-top:12px;border-top:1px solid var(--bd)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px}.mh .btn{padding:8px 10px;font-size:14px;min-height:40px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.top .badge{margin:0;flex:none}.dst{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px;font-size:17px}.seta{background:none;border:0;font-size:24px;line-height:1;padding:6px 10px;cursor:pointer;color:var(--navy);transition:transform .15s}.seta.up{transform:rotate(180deg)}
.mv{margin-top:8px;width:100%;padding:8px;border-radius:8px;border:1px solid var(--bd);background:#fff}
.list{padding:0 16px 24px;display:grid;gap:10px}
#modal{position:fixed;inset:0;background:rgba(10,20,40,.55);display:none;align-items:flex-start;justify-content:center;overflow:auto;z-index:20;padding:16px}
#modal .box{background:#fff;border-radius:16px;max-width:560px;width:100%;padding:16px}
.box h3{margin:14px 0 6px;font-size:14px;color:var(--navy);text-transform:uppercase;letter-spacing:.04em}
.box label{display:block;font-size:13px;color:var(--mut);margin-top:8px}
.box input,.box textarea,.box select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}
.arq{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.arq span{flex:1 1 140px;word-break:break-all}
.arq button{padding:6px 10px;border-radius:8px;border:1px solid var(--bd);background:#fff}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.sync{font-size:12px;opacity:.85;width:100%}
</style></head><body>
<header><h1>📒 Minhas Notas</h1>
<button class="btn hd" id="bNova">+ Nova ficha</button>
<button class="btn hd" id="bZip">⬇ Baixar todas as fichas</button>
<button class="btn hd" id="bImp">⬆ Importar dados</button><input type="file" id="impf" hidden><button class="btn hd" id="bDrv">☁ Drive</button>
<div class="sync" id="sync">● Salvo neste dispositivo (funciona sem internet)</div></header>
<div class="bar">
<input id="q" type="search" placeholder="Pesquisar NE, NF, empresa, destino, observações">
<select id="fs"><option value="">Todos os status</option><option>Pendente</option><option>Para Fazer</option><option>Em andamento</option><option>Pronto</option></select>
<select id="vw"><option value="board">Quadro</option><option value="list">Lista</option><option value="arq">Arquivadas</option></select></div>
<p id="msg"></p>
<main id="main"></main>
<div id="modal"><div class="box" id="box"></div></div>
<script>
const S=['Pendente','Para Fazer','Em andamento','Pronto'];let EX=new Set(),OPEN=false;
let db,fichas=[],M=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fmt=d=>d?new Date(d).toLocaleDateString('pt-BR'):'';
function say(t,warn){const m=$('msg');m.textContent=t;m.className=warn?'w':'';m.style.display=t?'block':'none'}
function open_(){return new Promise((ok,no)=>{const r=indexedDB.open('minhas-notas',2);
r.onupgradeneeded=()=>{const d=r.result,h=n=>d.objectStoreNames.contains(n);if(!h('fichas'))d.createObjectStore('fichas',{keyPath:'id'});if(!h('arquivos'))d.createObjectStore('arquivos',{keyPath:'id'}).createIndex('fichaId','fichaId');};
r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
function run(stores,fn){return new Promise((ok,no)=>{const t=db.transaction(stores,'readwrite');let out;
Promise.resolve(fn(t)).then(v=>out=v);t.oncomplete=()=>ok(out);t.onerror=t.onabort=()=>no(t.error)})}
const req=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const getFiles=id=>req(db.transaction('arquivos').objectStore('arquivos').index('fichaId').getAll(id));
async function load(){fichas=await req(db.transaction('fichas').objectStore('fichas').getAll());
const vel=fichas.filter(f=>f.status==='Aguardando');if(vel.length){vel.forEach(f=>f.status='Em andamento');await run('fichas',t=>vel.forEach(f=>t.objectStore('fichas').put(f)))}
render()}
function match(f){const q=$('q').value.trim().toLowerCase();
if(q&&![f.ne,f.nf,f.empresa,f.destino,f.obs].some(v=>String(v||'').toLowerCase().includes(q)))return false;
const s=$('fs').value;return !s||f.status===s}
const fmtObs=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');
function wrap(m){const t=$('fob'),a=t.selectionStart,b=t.selectionEnd,v=t.value;t.value=v.slice(0,a)+m+v.slice(a,b)+m+v.slice(b);t.focus();t.setSelectionRange(a+m.length,b+m.length)}
function obs(f){if(!f.obs)return '';const o=EX.has(f.id);
return `<div class="orow"><div class="obs${o?' open':''}">${fmtObs(f.obs)}</div>`+(f.obs.length>70||f.obs.includes('\n')?`<button class="mais" data-ob="${f.id}">${o?'Ler menos':'Ler mais'}</button>`:'')+'</div>'}
function card(f){const i=S.indexOf(f.status);
return `<div class="ficha s${i}" draggable="true" data-id="${f.id}"><div class="top"><b>NE ${esc(f.ne)||'—'} | NF ${esc(f.nf)||'—'}</b><span class="badge b${i}">${f.status}</span></div>
<div class="emp">${f.empresa?'Empresa: '+esc(f.empresa):''}</div><div class="dst"><small>${fmt(f.atualizada)}</small><button class="seta${OPEN?' up':''}" data-seta="1" aria-label="Mostrar ou ocultar detalhes">▾</button></div>
${OPEN?`<div>Destino: ${esc(f.destino)||'—'}</div>${obs(f)}<select class="mv" data-mv="${f.id}"><option value="">Mover para outro cartão…</option>${S.filter(s=>s!==f.status).map(s=>`<option>${s}</option>`).join('')}</select>`:''}</div>`}
function linha(){const el=$('sync');if(!el)return;let t='● Salvo neste dispositivo (funciona sem internet)';
try{if(localStorage.getItem('mn_cid')){const last=+localStorage.getItem('mn_last')||0,p=fichas.filter(f=>f.atualizada>last).length+Object.values(tomb()).filter(v=>v>last).length;t+=p?` · ◐ ${p} alteração(ões) ainda não enviada(s) ao Drive`:' · ✔ Drive em dia'}}catch(e){}el.textContent=t}
function render(){linha();const v=$('vw').value,m=$('main');
const vis=fichas.filter(f=>(v==='arq'?f.arquivada:!f.arquivada)&&match(f)).sort((a,b)=>b.atualizada-a.atualizada);
if(v==='board'){m.innerHTML='<div class="board">'+S.map(s=>{const l=vis.filter(f=>f.status===s);
return `<div class="col" data-col="${s}"><h2>${s} <span class="n">${l.length}</span><button class="btn sec" style="min-height:32px;padding:2px 10px" data-new="${s}">+</button></h2>${l.map(card).join('')}</div>`}).join('')+'</div>'}
else m.innerHTML='<div class="list">'+(vis.map(card).join('')||'<p>Nenhuma ficha.</p>')+'</div>'}
document.addEventListener('click',e=>{
const n=e.target.closest('[data-new]');if(n){return edit(null,n.dataset.new)}
if(e.target.closest('[data-seta]')){OPEN=!OPEN;render();return}
const ob=e.target.closest('[data-ob]');if(ob){const i=ob.dataset.ob;EX.has(i)?EX.delete(i):EX.add(i);render();return}
if(e.target.closest('[data-mv]'))return;
const c=e.target.closest('.ficha');if(c)edit(c.dataset.id)});
document.addEventListener('change',e=>{const s=e.target.dataset?.mv;if(s&&e.target.value)move(s,e.target.value)});
document.addEventListener('dragstart',e=>{const c=e.target.closest?.('.ficha');if(c)e.dataTransfer.setData('text/plain',c.dataset.id)});
document.addEventListener('dragover',e=>{const c=e.target.closest?.('.col');if(c){e.preventDefault();c.classList.add('over')}});
document.addEventListener('dragleave',e=>e.target.closest?.('.col')?.classList.remove('over'));
document.addEventListener('drop',e=>{const c=e.target.closest?.('.col');if(!c)return;e.preventDefault();c.classList.remove('over');move(e.dataTransfer.getData('text/plain'),c.dataset.col)});
async function move(id,st){const f=fichas.find(x=>x.id===id);if(!f)return;f.status=st;f.atualizada=Date.now();
try{await run('fichas',t=>t.objectStore('fichas').put(f))}catch(e){say('Não foi possível salvar: '+(e?.message||e),1)}render()}
['q','fs','vw'].forEach(i=>$(i).addEventListener('input',render));
$('bNova').onclick=()=>edit(null,'Pendente');
async function edit(id,st){const f=id?fichas.find(x=>x.id===id):{id:uid(),ne:'',nf:'',empresa:'',destino:'',anexos:'',obs:'',status:st||'Pendente',criada:Date.now(),atualizada:Date.now(),arquivada:false,novo:true};
M={f:{...f},files:id?await getFiles(id):[],rem:[],add:[]};drawModal()}
function drawModal(){const f=M.f,all=[...M.files.filter(x=>!M.rem.includes(x.id)),...M.add];
$('box').innerHTML=`<div class="mh"><h2 style="margin:0">${f.novo?'Nova ficha':'Ficha'}</h2><button class="btn grn" id="mDone">✔ Marcar como pronto</button></div>
<h3>Identificação</h3><div class="row"><div><label>NE</label><input id="fne" value="${esc(f.ne)}" inputmode="text"></div><div><label>NF</label><input id="fnf" value="${esc(f.nf)}" inputmode="text"></div></div>
<label>Nome da empresa</label><input id="fem" value="${esc(f.empresa)}">
<label>Status</label><select id="fst">${S.map(s=>`<option${s===f.status?' selected':''}>${s}</option>`).join('')}</select>
<h3>Informações da nota</h3><label>Destino</label><input id="fde" value="${esc(f.destino)}" placeholder="Estoque, Obra X…">
<div class="row"><div><label>Data de criação</label><input disabled value="${fmt(f.criada)}"></div><div><label>Última atualização</label><input disabled value="${fmt(f.atualizada)}"></div></div>
<h3>Documentos</h3><label>Local dos anexos</label><input id="fla" value="${esc(f.anexos)}" placeholder="Pasta ou local onde estão os documentos">
<label>Arquivos anexados</label>${all.map(a=>`<div class="arq"><span>${esc(a.name)}</span><button data-a="open" data-i="${a.id}">Abrir</button><button data-a="dl" data-i="${a.id}">Baixar</button><button data-a="rm" data-i="${a.id}">Remover</button></div>`).join('')||'<small>Nenhum arquivo.</small>'}
<input type="file" id="ffi" multiple accept="application/pdf,image/*" style="margin-top:8px">
<h3>Observações</h3><div class="tb"><button type="button" id="tB"><b>B</b></button><button type="button" id="tI"><i>I</i></button><small>Selecione o texto e toque em B (negrito) ou I (itálico)</small></div><textarea id="fob" rows="3">${esc(f.obs)}</textarea>
<div class="acts"><button class="btn" id="mSave">Salvar</button><button class="btn sec" id="mArq">${f.arquivada?'Desarquivar':'Arquivar'}</button>${f.novo?'':'<button class="btn red" id="mDel">Excluir</button>'}</div><div class="fechar"><button class="btn sec" id="mX">Fechar</button></div>`;
$('modal').style.display='flex';
$('ffi').onchange=e=>{for(const x of e.target.files)M.add.push({id:uid(),fichaId:f.id,name:x.name,type:x.type,blob:x,novo:1});collect();drawModal()};
['tB','tI'].forEach(k=>{$(k).onmousedown=e=>e.preventDefault();$(k).onclick=()=>wrap(k==='tB'?'**':'*')});
$('mX').onclick=close_;$('mSave').onclick=()=>save();$('mDone').onclick=()=>{$('fst').value='Pronto';save()};
$('mArq').onclick=()=>{collect();M.f.arquivada=!M.f.arquivada;save()};
if($('mDel'))$('mDel').onclick=del;
$('box').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>fileAct(b.dataset.a,b.dataset.i))}
function collect(){const f=M.f;f.ne=$('fne').value.trim();f.nf=$('fnf').value.trim();f.empresa=$('fem').value.trim();f.status=$('fst').value;f.destino=$('fde').value.trim();f.anexos=$('fla').value.trim();f.obs=$('fob').value}
function fileAct(a,i){collect();const x=[...M.files,...M.add].find(z=>z.id===i);if(!x)return;
if(a==='rm'){if(!confirm('Remover este arquivo da ficha?'))return;M.add=M.add.filter(z=>z.id!==i);if(M.files.some(z=>z.id===i))M.rem.push(i);return drawModal()}
if(a==='open'){const u=URL.createObjectURL(x.blob);if(!window.open(u,'_blank'))saveFile(x.name,x.blob).catch(e=>say(e.message,1));setTimeout(()=>URL.revokeObjectURL(u),60000)}else saveFile(x.name,x.blob).catch(e=>say(e.message,1))}
function close_(){$('modal').style.display='none';M=null}
async function save(){collect();const f={...M.f};delete f.novo;f.atualizada=Date.now();
if(!f.ne&&!f.nf){alert('Informe ao menos NE ou NF.');return}
try{await run(['fichas','arquivos'],t=>{t.objectStore('fichas').put(f);M.rem.forEach(i=>t.objectStore('arquivos').delete(i));M.add.forEach(a=>t.objectStore('arquivos').put({id:a.id,fichaId:f.id,name:a.name,type:a.type,blob:a.blob}))})
}catch(e){const q=e&&e.name==='QuotaExceededError';alert(q?'Espaço de armazenamento insuficiente. Os arquivos não puderam ser salvos.':'Erro ao salvar: '+(e?.message||e));return}
close_();await load();say('Ficha salva neste dispositivo.')}
async function del(){if(!confirm('Excluir esta ficha e todos os seus arquivos?'))return;const id=M.f.id;
const fs=await getFiles(id);await run(['fichas','arquivos'],t=>{t.objectStore('fichas').delete(id);fs.forEach(a=>t.objectStore('arquivos').delete(a.id))});const T=tomb();T[id]=Date.now();setTomb(T);close_();load()}
const clean=s=>String(s||'').replace(/[\\/:*?"<>|\u0000-\u001f]/g,'').trim().replace(/\s+/g,'_').replace(/^\.+/,'');
function uniq(n,set,ext=''){let r=n+ext,k=2;while(set.has(r.toLowerCase()))r=`${n}_${k++}${ext}`;set.add(r.toLowerCase());return r}
async function saveFile(name,data){const d=window.claude?await claude.use('downloads'):null;
if(!d){const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data])),l=document.createElement('a');l.href=u;l.download=name;l.click();setTimeout(()=>URL.revokeObjectURL(u),60000);return}
try{await d.save({filename:name,data})}catch(e){throw new Error(e?.code==='declined'?'Download cancelado.':(e?.message||'Falha no download.'))}}
const tomb=()=>{try{return JSON.parse(localStorage.getItem('mn_excl')||'{}')}catch(e){return{}}};
const setTomb=t=>{try{localStorage.setItem('mn_excl',JSON.stringify(t))}catch(e){}};
const tipo=n=>({pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp'})[(n.split('.').pop()||'').toLowerCase()]||'';
async function removeLocal(id){const fs=await getFiles(id);await run(['fichas','arquivos'],t=>{t.objectStore('fichas').delete(id);fs.forEach(a=>t.objectStore('arquivos').delete(a.id))})}
async function buildZip(){const zip=new JSZip(),dirs=new Set(),warns=[],man=[];let n=0;
for(const f of fichas){n++;say(`Preparando ${n} de ${fichas.length}…`);
let base=`NE${clean(f.ne)}_NF${clean(f.nf)}_${clean(f.empresa)||f.id.slice(0,6)}`;
if(dirs.has(base.toLowerCase()))base+='_'+f.id.slice(0,6);dirs.add(base.toLowerCase());
const d=zip.folder(base),names=new Set(),arqs=[];
for(const a of await getFiles(f.id)){try{const dot=a.name.lastIndexOf('.');const nm=clean(dot>0?a.name.slice(0,dot):a.name)||'arquivo',ext=dot>0?a.name.slice(dot):'';
const fn=uniq(nm,names,ext);d.file(fn,a.blob);arqs.push({id:a.id,name:a.name,type:a.type,path:base+'/'+fn})}catch(e){warns.push(`${base}/${a.name}`)}}
man.push({...f,pasta:base,arqs})}
zip.file('_dados_minhas_notas.json',JSON.stringify({app:'minhas-notas',versao:2,fichas:man,excluidas:tomb()}));
return {zip,warns}}
async function mergeZip(z,antigoOk){const j=z.file('_dados_minhas_notas.json');let novas=0,atu=0,ign=0,antigo=false;const falt=[];
if(j){const d=JSON.parse(await j.async('string')),T=tomb();
for(const [id,em] of Object.entries(d.excluidas||{})){const l=fichas.find(x=>x.id===id);if(l&&em>l.atualizada){await removeLocal(id);fichas=fichas.filter(x=>x.id!==id)}if(em>(T[id]||0))T[id]=em}
setTomb(T);
for(const r of d.fichas){const {arqs=[],pasta,...f}=r,l=fichas.find(x=>x.id===f.id);if(f.status==='Aguardando')f.status='Em andamento';
if(T[f.id]>=f.atualizada||(l&&l.atualizada>=f.atualizada)){ign++;continue}
const fl=[];for(const a of arqs){const ze=z.file(a.path);if(!ze){falt.push(a.name);continue}fl.push({id:a.id,fichaId:f.id,name:a.name,type:a.type,blob:new Blob([await ze.async('arraybuffer')],{type:a.type})})}
const old=l?await getFiles(f.id):[];
await run(['fichas','arquivos'],t=>{t.objectStore('fichas').put(f);old.forEach(a=>t.objectStore('arquivos').delete(a.id));fl.forEach(a=>t.objectStore('arquivos').put(a))});
l?atu++:novas++}}
else{if(!antigoOk)throw new Error('O arquivo do Drive não tem os dados do app.');antigo=true;const pastas={};
z.forEach((p,en)=>{if(en.dir)return;const k=p.split('/');if(k.length<2||!k[0])return;(pastas[k[0]]=pastas[k[0]]||[]).push([k[k.length-1],en])});
const nomes=Object.keys(pastas);if(!nomes.length)throw new Error('Este ZIP não tem pastas de fichas.');
for(const pn of nomes){const m=pn.match(/^NE(.*?)_NF(.*?)_(.*)$/)||[],id=uid(),ag=Date.now();
const f={id,ne:m[1]||'',nf:m[2]||'',empresa:(m[3]||pn).replace(/_/g,' '),destino:'',anexos:'',obs:'',status:'Pendente',criada:ag,atualizada:ag,arquivada:false};
const fl=[];for(const [nm,en] of pastas[pn])fl.push({id:uid(),fichaId:id,name:nm,type:tipo(nm),blob:new Blob([await en.async('arraybuffer')],{type:tipo(nm)})});
await run(['fichas','arquivos'],t=>{t.objectStore('fichas').put(f);fl.forEach(a=>t.objectStore('arquivos').put(a))});novas++}}
await load();return {novas,atu,ign,falt,antigo}}
const msgR=r=>`${r.novas} nova(s), ${r.atu} atualizada(s), ${r.ign} já estavam iguais ou mais recentes aqui.`+(r.antigo?' ZIP de versão antiga: fichas criadas só com NE, NF, empresa e anexos (status Pendente).':'')+(r.falt.length?` Anexos não encontrados: ${r.falt.join(', ')}`:'');
$('bZip').onclick=async()=>{
if(typeof JSZip==='undefined'){say('Biblioteca ZIP não carregada. Abra o app uma vez com internet.',1);return}
if(!fichas.length){say('Não há fichas para exportar.',1);return}
try{const {zip,warns}=await buildZip();
const blob=await zip.generateAsync({type:'blob'},m=>say(`Gerando ZIP… ${Math.round(m.percent)}%`));
const nome=`Notas_${new Date().toLocaleDateString('sv-SE')}.zip`;await saveFile(nome,blob);
say(warns.length?`ZIP gerado, mas ${warns.length} arquivo(s) não foram incluídos: ${warns.join(', ')}`:`Exportação concluída: ${nome}. As fichas originais não foram alteradas.`,warns.length>0)
}catch(e){say('Falha na exportação: '+(e?.message||e),1)}};
$('bImp').onclick=()=>$('impf').click();
$('impf').onchange=async e=>{const file=e.target.files[0];if(!file)return;
try{if(typeof JSZip==='undefined')throw new Error('Biblioteca ZIP não carregada. Abra o app com internet uma vez.');say('Lendo arquivo…');
const r=await mergeZip(await JSZip.loadAsync(await file.arrayBuffer()),true);say('Importação concluída: '+msgR(r),r.falt.length>0||r.antigo)
}catch(err){const m='Falha ao importar: '+(err?.name==='QuotaExceededError'?'espaço insuficiente.':(err?.message||err));say(m,1);alert(m)}finally{e.target.value=''}};
/* ---- Google Drive ---- */
const SC='https://www.googleapis.com/auth/drive.file',DN='Minhas_Notas_dados.zip';let TK=null,TKx=0,DB=0;
const loadGsi=()=>new Promise((ok,no)=>{if(window.google?.accounts?.oauth2)return ok();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=ok;s.onerror=()=>no(new Error('Não foi possível carregar o login do Google. O Drive só funciona na versão hospedada (GitHub Pages etc.), com internet.'));document.head.appendChild(s)});
function getToken(){return new Promise((ok,no)=>{if(TK&&Date.now()<TKx)return ok(TK);const cid=localStorage.getItem('mn_cid');if(!cid)return no(new Error('Informe o Client ID do Google.'));
loadGsi().then(()=>{google.accounts.oauth2.initTokenClient({client_id:cid,scope:SC,callback:r=>{if(r.error)return no(new Error(r.error_description||r.error));TK=r.access_token;localStorage.removeItem('mn_sel');TKx=Date.now()+(r.expires_in-60)*1000;ok(TK)},error_callback:e=>no(new Error('Login cancelado ou bloqueado ('+(e.type||'erro')+').'))}).requestAccessToken({prompt:localStorage.getItem('mn_sel')?'select_account':''})}).catch(no)})}
function drawDrive(){const cid=localStorage.getItem('mn_cid')||'',last=+localStorage.getItem('mn_last')||0;
$('box').innerHTML=`<h2 style="margin:0">☁ Google Drive</h2>
<p style="color:var(--mut);font-size:14px">Guarda o arquivo ${DN} no seu Drive e junta as fichas dos seus aparelhos. Se a mesma ficha for editada em dois aparelhos, vale a mais recente.</p>
<label>Client ID do Google</label><input id="dcid" value="${esc(cid)}" placeholder="xxxx.apps.googleusercontent.com">
<p style="font-size:13px;color:var(--mut)">Última sincronização: ${last?new Date(last).toLocaleString('pt-BR'):'nunca'}</p>
<div class="acts"><button class="btn" id="dGo">Sincronizar agora</button><button class="btn sec" id="dTr">Escolher outra conta</button></div><div class="fechar"><button class="btn sec" id="dX">Fechar</button></div>`;
$('modal').style.display='flex';$('dX').onclick=close_;$('dGo').onclick=()=>{localStorage.setItem('mn_cid',$('dcid').value.trim());close_();driveSync()};$('dTr').onclick=()=>{localStorage.setItem('mn_cid',$('dcid').value.trim());localStorage.setItem('mn_sel','1');localStorage.removeItem('mn_fid');TK=null;close_();driveSync()}}
$('bDrv').onclick=drawDrive;
async function driveSync(){if(DB)return;DB=1;
try{if(typeof JSZip==='undefined')throw new Error('Biblioteca ZIP não carregada.');if(!navigator.onLine)throw new Error('Sem internet.');
const t0=Date.now();say('Entrando no Google…');const H={Authorization:'Bearer '+await getToken()};let id=localStorage.getItem('mn_fid'),r0=null;
if(!id){say('Procurando dados no Drive…');const r=await fetch('https://www.googleapis.com/drive/v3/files?orderBy=modifiedTime%20desc&fields=files(id)&q='+encodeURIComponent(`name='${DN}' and trashed=false`),{headers:H});if(!r.ok)throw new Error('Drive respondeu '+r.status);id=(await r.json()).files?.[0]?.id||null}
if(id){const r=await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,{headers:H});
if(r.status===404)id=null;else if(!r.ok)throw new Error('Drive respondeu '+r.status);else{say('Juntando com os dados do Drive…');r0=await mergeZip(await JSZip.loadAsync(await r.arrayBuffer()))}}
say('Enviando para o Drive…');const {zip,warns}=await buildZip(),blob=await zip.generateAsync({type:'blob'});
if(!id){const r=await fetch('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({name:DN,mimeType:'application/zip'})});if(!r.ok)throw new Error('Não foi possível criar o arquivo no Drive ('+r.status+')');id=(await r.json()).id}
const u=await fetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{method:'PATCH',headers:{...H,'Content-Type':'application/zip'},body:blob});
if(!u.ok)throw new Error('Falha ao enviar para o Drive ('+u.status+')');
localStorage.setItem('mn_fid',id);localStorage.setItem('mn_last',String(t0));render();
say('Drive sincronizado. '+(r0?'Recebido do Drive: '+msgR(r0):'Primeiro envio concluído.')+(warns.length?` Atenção: ${warns.length} arquivo(s) não entraram no envio.`:''),warns.length>0||!!r0?.falt.length)
}catch(e){TK=null;say('Falha no Drive: '+(e?.message||e)+' As fichas continuam salvas neste aparelho.',1)}finally{DB=0}}
open_().then(async d=>{db=d;await load();navigator.storage?.persist?.();}).catch(e=>say('Armazenamento local indisponível: '+(e?.message||e),1));
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
